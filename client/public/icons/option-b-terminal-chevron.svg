<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="tb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#151221"/>
      <stop offset="50%" stopColor="#0d0b14"/>
      <stop offset="100%" stopColor="#050508"/>
    </linearGradient>

    <linearGradient id="tb-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#a855f7" stopOpacity="0.6"/>
      <stop offset="100%" stopColor="#06b6d4" stopOpacity="0.2"/>
    </linearGradient>

    <linearGradient id="tb-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#c084fc"/>
      <stop offset="40%" stopColor="#818cf8"/>
      <stop offset="80%" stopColor="#38bdf8"/>
      <stop offset="100%" stopColor="#34d399"/>
    </linearGradient>

    <filter id="tb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Drop Shadow -->
  <rect x="36" y="44" width="440" height="440" rx="100" fill="#000000" opacity="0.55" filter="blur(20px)"/>

  <!-- Squircle Base -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="url(#tb-bg)" stroke="url(#tb-rim)" stroke-width="2.5"/>

  <!-- Subtle Terminal Matrix Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="80" y1="120" x2="432" y2="120"/>
    <line x1="80" y1="180" x2="432" y2="180"/>
    <line x1="80" y1="240" x2="432" y2="240"/>
    <line x1="80" y1="300" x2="432" y2="300"/>
    <line x1="80" y1="360" x2="432" y2="360"/>
    <line x1="120" y1="80" x2="120" y2="432"/>
    <line x1="180" y1="80" x2="180" y2="432"/>
    <line x1="240" y1="80" x2="240" y2="432"/>
    <line x1="300" y1="80" x2="300" y2="432"/>
    <line x1="360" y1="80" x2="360" y2="432"/>
  </g>

  <!-- Ambient Under-Glow -->
  <path d="M 140 140 L 372 140 L 260 380 L 200 380 L 290 200 L 140 200 Z" fill="url(#tb-gradient)" opacity="0.35" filter="url(#tb-glow)"/>

  <!-- Terminal Chevron ">" nested with "7" -->
  <!-- The Chevron Arrow Head -->
  <path d="M 120 220 L 195 270 L 120 320" fill="none" stroke="url(#tb-gradient)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#tb-glow)"/>
  <path d="M 120 220 L 195 270 L 120 320" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The "7" Roof & Slanted Downstroke -->
  <path d="M 160 140 L 380 140 L 260 380" fill="none" stroke="url(#tb-gradient)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#tb-glow)"/>
  <path d="M 160 140 L 380 140 L 260 380" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Terminal Command Line Cursor "_" Block -->
  <rect x="278" y="364" width="34" height="12" rx="3" fill="#34d399" filter="url(#tb-glow)"/>

  <!-- Top Status Dots (macOS Window Beads) -->
  <circle cx="75" cy="75" r="5" fill="#f43f5e" opacity="0.8"/>
  <circle cx="95" cy="75" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="115" cy="75" r="5" fill="#10b981" opacity="0.8"/>
</svg>

