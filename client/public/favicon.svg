<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="nr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#18181b"/>
      <stop offset="60%" stopColor="#09090b"/>
      <stop offset="100%" stopColor="#030304"/>
    </linearGradient>

    <linearGradient id="nr-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#71717a" stopOpacity="0.8"/>
      <stop offset="100%" stopColor="#27272a" stopOpacity="0.4"/>
    </linearGradient>

    <linearGradient id="nr-rack-top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#3f3f46"/>
      <stop offset="100%" stopColor="#27272a"/>
    </linearGradient>

    <linearGradient id="nr-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#a855f7"/>
      <stop offset="100%" stopColor="#06b6d4"/>
    </linearGradient>

    <filter id="nr-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Drop Shadow -->
  <rect x="36" y="44" width="440" height="440" rx="100" fill="#000000" opacity="0.6" filter="blur(20px)"/>

  <!-- Squircle Base -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="url(#nr-bg)" stroke="url(#nr-rim)" stroke-width="2.5"/>

  <!-- Rack Mount Ears & Screw Holes -->
  <g fill="#27272a" stroke="#52525b" stroke-width="1.2">
    <circle cx="68" cy="140" r="5"/>
    <circle cx="68" cy="170" r="5"/>
    <circle cx="68" cy="340" r="5"/>
    <circle cx="68" cy="370" r="5"/>
    <circle cx="444" cy="140" r="5"/>
    <circle cx="444" cy="170" r="5"/>
    <circle cx="444" cy="340" r="5"/>
    <circle cx="444" cy="370" r="5"/>
  </g>

  <!-- SRE Neural Optical Halo Glow -->
  <circle cx="340" cy="165" r="70" fill="url(#nr-glow)" opacity="0.3" filter="url(#nr-filter)"/>

  <!-- THE ISOMETRIC SERVER BLADE RACK "7" -->
  <!-- Top Horizontal Rack Blade Chassis -->
  <path d="M 120 140 L 380 140 L 360 195 L 140 195 Z" fill="url(#nr-rack-top)" stroke="#52525b" stroke-width="1.5"/>
  <path d="M 120 140 L 120 165 L 360 220 L 360 195 Z" fill="#18181b" stroke="#27272a" stroke-width="1"/>

  <!-- Downward Slanted Support Chassis -->
  <path d="M 380 140 L 360 195 L 245 380 L 195 380 Z" fill="#1f1f23" stroke="#3f3f46" stroke-width="1.5"/>

  <!-- Front Bezel Detail: Slotted Cooling Louvers -->
  <g stroke="#09090b" stroke-width="2.5" stroke-linecap="round">
    <line x1="160" y1="168" x2="160" y2="182"/>
    <line x1="172" y1="168" x2="172" y2="182"/>
    <line x1="184" y1="168" x2="184" y2="182"/>
    <line x1="196" y1="168" x2="196" y2="182"/>
    <line x1="208" y1="168" x2="208" y2="182"/>
    <line x1="220" y1="168" x2="220" y2="182"/>
    <line x1="232" y1="168" x2="232" y2="182"/>
  </g>

  <!-- 3 Hot-Swap NVMe Drive Caddies -->
  <g transform="translate(250, 160)">
    <rect x="0" y="0" width="22" height="24" rx="2" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <circle cx="6" cy="6" r="1.5" fill="#10b981"/>
    <rect x="28" y="0" width="22" height="24" rx="2" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <circle cx="34" cy="6" r="1.5" fill="#10b981"/>
    <rect x="56" y="0" width="22" height="24" rx="2" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <circle cx="62" cy="6" r="1.5" fill="#38bdf8"/>
  </g>

  <!-- SRE Coprocessor Illuminated Optical Lens & Prism (Corner of the 7) -->
  <g transform="translate(340, 165)">
    <!-- Lens Ring -->
    <circle cx="0" cy="0" r="28" fill="#18181b" stroke="#71717a" stroke-width="2"/>
    <circle cx="0" cy="0" r="20" fill="url(#nr-glow)" opacity="0.8" filter="url(#nr-filter)"/>
    <circle cx="0" cy="0" r="12" fill="#ffffff"/>
    <!-- Optical Crosshairs -->
    <line x1="-32" y1="0" x2="-22" y2="0" stroke="#a855f7" stroke-width="2"/>
    <line x1="22" y1="0" x2="32" y2="0" stroke="#a855f7" stroke-width="2"/>
    <line x1="0" y1="-32" x2="0" y2="-22" stroke="#a855f7" stroke-width="2"/>
    <line x1="0" y1="22" x2="0" y2="32" stroke="#a855f7" stroke-width="2"/>
  </g>

  <!-- Downward Optical Data Trace on Diagonal Stem -->
  <path d="M 330 195 L 225 365" fill="none" stroke="url(#nr-glow)" stroke-width="8" stroke-linecap="round" filter="url(#nr-filter)"/>
  <path d="M 330 195 L 225 365" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Precision Foot Marking -->
  <text x="256" y="440" fill="#71717a" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="700" letter-spacing="4" text-anchor="middle">SRE • HYPER-RACK</text>
</svg>

