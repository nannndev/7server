<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="nr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="60%" stop-color="#121215"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <linearGradient id="nr-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e4e4e7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#71717a" stop-opacity="0.65"/>
    </linearGradient>

    <linearGradient id="nr-rack-top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>

    <linearGradient id="nr-rack-stem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4d4d8"/>
      <stop offset="100%" stop-color="#71717a"/>
    </linearGradient>

    <linearGradient id="nr-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <filter id="nr-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base (Full Bleed for Crisp 16x16 Favicon Rendering) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#nr-bg)" stroke="url(#nr-rim)" stroke-width="14"/>

  <!-- SRE Neural Optical Halo Glow -->
  <circle cx="355" cy="155" r="78" fill="url(#nr-glow)" opacity="0.45" filter="url(#nr-filter)"/>

  <!-- THE ISOMETRIC SERVER BLADE RACK "7" (High Contrast Silver for Dark Browser Tabs) -->
  <!-- Top Horizontal Rack Blade Chassis -->
  <path d="M 105 115 L 405 115 L 380 190 L 125 190 Z" fill="url(#nr-rack-top)" stroke="#ffffff" stroke-width="3"/>

  <!-- Downward Slanted Support Chassis -->
  <path d="M 405 115 L 380 190 L 250 415 L 180 415 L 305 190 Z" fill="url(#nr-rack-stem)" stroke="#e4e4e7" stroke-width="3"/>

  <!-- 3 Status LEDs on Stem -->
  <circle cx="288" cy="255" r="9" fill="#10b981"/>
  <circle cx="268" cy="295" r="9" fill="#10b981"/>
  <circle cx="242" cy="345" r="9" fill="#38bdf8"/>

  <!-- SRE Coprocessor Illuminated Optical Lens (Corner of the 7) -->
  <g transform="translate(355, 152)">
    <circle cx="0" cy="0" r="34" fill="#18181b" stroke="#e4e4e7" stroke-width="4"/>
    <circle cx="0" cy="0" r="24" fill="url(#nr-glow)"/>
    <circle cx="0" cy="0" r="13" fill="#ffffff"/>
  </g>
</svg>
