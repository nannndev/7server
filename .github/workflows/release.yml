# Runs when a version tag is pushed (node scripts/release.mjs patch && git push origin main vX.Y.Z).
# npm auth: Trusted Publishing (npmjs.com > sevenserver > Settings > Trusted Publisher: nannndev/7server, release.yml).
name: Release
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # GitHub Release
  packages: write   # ghcr.io image
  id-token: write   # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Tag matches package version
        run: |
          v=$(node -p "require('./packages/npm/package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but packages/npm is $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
          case "$v" in *-*) echo "NPM_TAG=next" >> "$GITHUB_ENV";; *) echo "NPM_TAG=latest" >> "$GITHUB_ENV";; esac

      - run: npm ci --no-audit --no-fund
        working-directory: server
      - run: npm ci --no-audit --no-fund
        working-directory: client
      - run: npx tsc --noEmit -p . && cd ../client && npx tsc --noEmit -p .
        working-directory: server
      - run: npm test
      - run: npm run pack:npm
      - name: Locate tarball & compute SHA256
        run: |
          TGZ=$(ls packages/npm/sevenserver-*.tgz | head -n1)
          [ -f "$TGZ" ] || { echo "tarball not found"; exit 1; }
          SHA=$(sha256sum "$TGZ" | awk '{print $1}')
          echo "TARBALL_PATH=$TGZ" >> "$GITHUB_ENV"
          echo "TARBALL_NAME=$(basename "$TGZ")" >> "$GITHUB_ENV"
          echo "TARBALL_SHA256=$SHA" >> "$GITHUB_ENV"

      # Trusted Publishing (OIDC, no token) needs npm >= 11.5.1; falls back to NPM_TOKEN if that secret is set.
      - name: Publish to npm
        continue-on-error: true
        run: npm install -g npm@^11.5.1 --no-audit --no-fund && npm publish --provenance --access public --tag "$NPM_TAG" --loglevel verbose
        working-directory: packages/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: check-secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "has_dockerhub=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$HOMEBREW_TAP_TOKEN" ]; then
            echo "has_tap_token=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v4
        if: steps.check-secrets.outputs.has_dockerhub == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/7server
            ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/7server', secrets.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ env.NPM_TAG == 'latest' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pre=""; [ "$NPM_TAG" = next ] && pre="--prerelease"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$TARBALL_PATH" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$TARBALL_PATH" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $pre
          fi

      - name: Update Homebrew Tap
        if: steps.check-secrets.outputs.has_tap_token == 'true' && env.NPM_TAG == 'latest'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/nannndev/homebrew-tap.git" /tmp/homebrew-tap
          mkdir -p /tmp/homebrew-tap/Formula
          sed -e "s|v0\.3\.1/sevenserver-0\.3\.1\.tgz|${GITHUB_REF_NAME}/${TARBALL_NAME}|g" \
              -e "s|REPLACE_WITH_TARBALL_SHA256|${TARBALL_SHA256}|g" \
              packages/homebrew/sevenserver.rb > /tmp/homebrew-tap/Formula/sevenserver.rb
          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sevenserver.rb
          git commit -m "sevenserver ${VERSION}" || exit 0
          git push origin HEAD
