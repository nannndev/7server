services:
  sevenserver:
    image: ghcr.io/nannndev/7server:latest
    container_name: 7server
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - sevenserver_data:/data
    environment:
      - HOST=0.0.0.0
      - PORT=5001
      # Optional: set initial admin password on first boot (skips setup code)
      # - DASHBOARD_PASSWORD=change-me-please

volumes:
  sevenserver_data:
