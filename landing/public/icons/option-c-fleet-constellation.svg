<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="fc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#0c111d"/>
      <stop offset="50%" stopColor="#090d16"/>
      <stop offset="100%" stopColor="#030508"/>
    </linearGradient>

    <linearGradient id="fc-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#38bdf8" stopOpacity="0.5"/>
      <stop offset="100%" stopColor="#1e293b" stopOpacity="0.8"/>
    </linearGradient>

    <linearGradient id="cube-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#38bdf8"/>
      <stop offset="100%" stopColor="#0284c7"/>
    </linearGradient>
    <linearGradient id="cube-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#0369a1"/>
      <stop offset="100%" stopColor="#075985"/>
    </linearGradient>
    <linearGradient id="cube-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#0c4a6e"/>
      <stop offset="100%" stopColor="#082f49"/>
    </linearGradient>

    <linearGradient id="cube-purple-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#c084fc"/>
      <stop offset="100%" stopColor="#9333ea"/>
    </linearGradient>
    <linearGradient id="cube-purple-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#7e22ce"/>
      <stop offset="100%" stopColor="#581c87"/>
    </linearGradient>
    <linearGradient id="cube-purple-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#3b0764"/>
      <stop offset="100%" stopColor="#2e1065"/>
    </linearGradient>

    <filter id="fc-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Drop Shadow -->
  <rect x="36" y="44" width="440" height="440" rx="100" fill="#000000" opacity="0.6" filter="blur(22px)"/>

  <!-- Squircle Base -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="url(#fc-bg)" stroke="url(#fc-rim)" stroke-width="2.5"/>

  <!-- Orbital Ring Trails (Subtle Cloud Mesh) -->
  <ellipse cx="256" cy="256" rx="160" ry="80" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="6 4" transform="rotate(-25, 256, 256)"/>
  <ellipse cx="256" cy="256" rx="180" ry="90" fill="none" stroke="#a855f7" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="8 6" transform="rotate(35, 256, 256)"/>

  <!-- Glowing Fiber Data Bus Connecting Nodes in Shape of "7" -->
  <!-- Top Horizontal Leg (Node 1 to Node 2) -->
  <line x1="150" y1="160" x2="360" y2="160" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" filter="url(#fc-glow)"/>
  <line x1="150" y1="160" x2="360" y2="160" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Slanted Downward Leg (Node 2 to Node 3) -->
  <line x1="360" y1="160" x2="230" y2="380" stroke="#c084fc" stroke-width="12" stroke-linecap="round" filter="url(#fc-glow)"/>
  <line x1="360" y1="160" x2="230" y2="380" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <!-- NODE 1: TOP LEFT (Orchestrator VPS) -->
  <g transform="translate(150, 160)">
    <!-- Isometric Cube -->
    <polygon points="0,-24 24,-10 0,4 -24,-10" fill="url(#cube-purple-top)" stroke="#c084fc" stroke-width="0.8"/>
    <polygon points="-24,-10 0,4 0,32 -24,18" fill="url(#cube-purple-left)"/>
    <polygon points="0,4 24,-10 24,18 0,32" fill="url(#cube-purple-right)"/>
    <!-- Status Activity Halo -->
    <circle cx="0" cy="4" r="5" fill="#38bdf8" filter="url(#fc-glow)"/>
  </g>

  <!-- NODE 2: TOP RIGHT (Edge Gateway) -->
  <g transform="translate(360, 160)">
    <polygon points="0,-28 28,-12 0,4 -28,-12" fill="url(#cube-top)" stroke="#7dd3fc" stroke-width="0.8"/>
    <polygon points="-28,-12 0,4 0,36 -28,20" fill="url(#cube-left)"/>
    <polygon points="0,4 28,-12 28,20 0,36" fill="url(#cube-right)"/>
    <circle cx="0" cy="4" r="6" fill="#10b981" filter="url(#fc-glow)"/>
  </g>

  <!-- NODE 3: BOTTOM (Database Cluster) -->
  <g transform="translate(230, 380)">
    <polygon points="0,-26 26,-11 0,4 -26,-11" fill="url(#cube-top)" stroke="#7dd3fc" stroke-width="0.8"/>
    <polygon points="-26,-11 0,4 0,34 -26,19" fill="url(#cube-left)"/>
    <polygon points="0,4 26,-11 26,19 0,34" fill="url(#cube-right)"/>
    <circle cx="0" cy="4" r="5" fill="#ec4899" filter="url(#fc-glow)"/>
  </g>

  <!-- Node Pulsing Rings -->
  <circle cx="150" cy="160" r="38" fill="none" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.4"/>
  <circle cx="360" cy="160" r="44" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4"/>
  <circle cx="230" cy="380" r="40" fill="none" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Small Corner Badges -->
  <text x="256" y="440" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="700" letter-spacing="4" text-anchor="middle">7SERVER • FLEET</text>
</svg>

